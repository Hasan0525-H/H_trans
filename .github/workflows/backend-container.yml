name: Verify deployable backend container
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build Railway-compatible container
        run: docker build --progress plain -f backend/Dockerfile -t arabiflow-backend:test backend
      - name: Validate installed transformation tools
        run: |
          docker run --rm --entrypoint sh arabiflow-backend:test -c '
            apktool --version &&
            /opt/android-sdk/build-tools/35.0.0/zipalign -h >/dev/null 2>&1 &&
            /opt/android-sdk/build-tools/35.0.0/apksigner --version &&
            keytool -help >/dev/null 2>&1
          '
