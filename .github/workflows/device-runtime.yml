name: Verify Android runtime APK conversion
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/arabiflow/device/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/device-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build real, owned APK as instrumented test asset
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon :fixture:assembleDebug
          mkdir -p app/src/androidTest/assets
          cp fixture/build/outputs/apk/debug/fixture-debug.apk app/src/androidTest/assets/fixture.apk
      - name: Allow emulator access to KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Run real conversion inside emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
