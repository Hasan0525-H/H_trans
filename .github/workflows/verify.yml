name: Verify Android and Backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Compile backend
        run: python -m compileall -q backend/arabiflow

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and unit test Android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :core:model:test
      - name: Upload tested debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArabiFlow-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  apk-rebuild-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build owned test fixture APK
        run: gradle --no-daemon :fixture:assembleDebug
      - name: Install verified Apktool and Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          curl --fail --silent --show-error --location \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -o "$RUNNER_TEMP/apktool.jar"
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/apktool.jar" | sha256sum -c -
          printf '#!/bin/sh\nexec java -Xmx3g -jar "%s/apktool.jar" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/apktool"
          chmod +x "$RUNNER_TEMP/apktool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Decode / translate / rebuild / sign / verify real fixture APK
        env:
          PYTHONPATH: backend
          ZIPALIGN: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/zipalign
          APKSIGNER: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/apksigner
        run: python backend/tests/smoke_real_apk.py fixture/build/outputs/apk/debug/fixture-debug.apk
