name: Verify Android and Backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Compile backend
        run: python -m compileall -q backend/arabiflow

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and unit test Android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload tested debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArabiFlow-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
